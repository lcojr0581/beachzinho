<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Beachzinho — Beach Tennis</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#003e73">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Beachzinho">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="icon" href="/icon-192.png">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--navy:#003e73;--navy2:#0078d4;--navy3:#005a9e;--org:#ffb900;--grn:#107c10;--red:#d13438;--blu:#60cdff;--bg:#f3f3f3}
body{font-family:'Segoe UI',Arial,sans-serif;background:#dfe3e8;min-height:100vh;display:flex;justify-content:center;align-items:flex-start;padding:16px 0}
.phone{width:100%;max-width:420px;min-height:92vh;background:var(--bg);border-radius:28px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 10px 60px rgba(0,0,0,.5);position:relative}
@media(max-width:440px){body{padding:0}.phone{border-radius:0;min-height:100vh}}
/* MODO COMPUTADOR — painel com menu lateral */
@media(min-width:900px){
body:not(.force-mobile){padding:0;display:block;background:#f5f5f5}
body:not(.force-mobile) .phone{max-width:none;width:100%;height:100vh;max-height:none;border-radius:0;box-shadow:none;display:flex;flex-direction:row;background:#f5f5f5}
body:not(.force-mobile) #navbar{order:-1;flex-shrink:0}
body:not(.force-mobile) #navbar .nav{position:sticky;top:0;height:100vh;flex-direction:column;align-items:stretch;justify-content:flex-start;gap:4px;width:250px;padding:20px 14px;border-radius:0}
body:not(.force-mobile) #navbar .nav::before{content:'🏖️ Beachzinho';display:block;font-weight:800;font-size:1.35em;letter-spacing:-.3px;padding:8px 12px 20px;border-bottom:1px solid rgba(128,128,128,.28);margin-bottom:14px}
body:not(.force-mobile) #navbar .ni{display:flex;align-items:center;gap:12px;font-size:.97em;font-weight:600;padding:12px 14px;border-radius:8px;width:100%;text-align:left;transition:background .15s,color .15s}
body:not(.force-mobile) #navbar .ni span{font-size:1.2em;margin:0}
body:not(.force-mobile) #app{flex:1;height:100vh;overflow-y:auto;padding-bottom:56px}
body:not(.force-mobile) .pad{max-width:960px;margin:0 auto;padding:28px 36px}
body:not(.force-mobile) .hd{padding:18px max(36px,calc(50% - 480px))}
body:not(.force-mobile) .splash{min-height:100vh}
body:not(.force-mobile) .rolebtn{max-width:440px}
body:not(.force-mobile) #toast{position:fixed}
body:not(.force-mobile) .card,body:not(.force-mobile) .hcard,body:not(.force-mobile) .rk,body:not(.force-mobile) .slot,body:not(.force-mobile) .score,body:not(.force-mobile) .plano,body:not(.force-mobile) .stat,body:not(.force-mobile) .news{box-shadow:none;border:1px solid #e3e3e3;border-radius:10px}
body:not(.force-mobile) .btn{border-radius:6px;font-weight:600;font-size:.95em}
body:not(.force-mobile) .badge{border-radius:5px}
body:not(.force-mobile) .tabs .tab,body:not(.force-mobile) .chip,body:not(.force-mobile) .day{border-radius:6px}
}
/* chrome claro */
@media(min-width:900px){
body:not(.force-mobile):not(.dark) #navbar .nav{background:#fff;border-right:1px solid #e1e1e1}
body:not(.force-mobile):not(.dark) #navbar .nav::before{color:#0078d4}
body:not(.force-mobile):not(.dark) #navbar .ni{color:#3a3a3a}
body:not(.force-mobile):not(.dark) #navbar .ni:hover{background:#f2f7fc}
body:not(.force-mobile):not(.dark) #navbar .ni.on{background:#e6f1fb;color:#0078d4;box-shadow:inset 3px 0 0 #0078d4}
body:not(.force-mobile):not(.dark) .hd{background:#fff;border-bottom:1px solid #e1e1e1;color:#1b1b1b}
body:not(.force-mobile):not(.dark) .hd h2{color:#1b1b1b}
body:not(.force-mobile):not(.dark) .hd .sub{color:#666;opacity:1}
body:not(.force-mobile):not(.dark) .hd .back{background:#f0f0f0;color:#1b1b1b}
body:not(.force-mobile):not(.dark) .btn-o{background:#0078d4;color:#fff}
body:not(.force-mobile):not(.dark) .btn-n{background:#fff;color:#0078d4;border:1px solid #0078d4}
body:not(.force-mobile):not(.dark) .tab.on{background:#0078d4;border-color:#0078d4;color:#fff}
body:not(.force-mobile):not(.dark) .stat b{color:#005a9e}
body:not(.force-mobile):not(.dark) .stitle{color:#3a3a3a}
body:not(.force-mobile):not(.dark) #btn-dark,body:not(.force-mobile):not(.dark) #btn-view{background:#fff;border-color:#d0d0d0;color:#3a3a3a}
}
/* chrome escuro */
@media(min-width:900px){
body.dark:not(.force-mobile){background:#141414}
body.dark:not(.force-mobile) .phone{background:#141414}
body.dark:not(.force-mobile) #navbar .nav{background:#252525;border-right:1px solid #3a3a3a}
body.dark:not(.force-mobile) #navbar .nav::before{color:#60cdff}
body.dark:not(.force-mobile) #navbar .ni:hover{background:#2e2e2e}
body.dark:not(.force-mobile) #navbar .ni.on{background:#17293a;color:#60cdff;box-shadow:inset 3px 0 0 #60cdff}
body.dark:not(.force-mobile) .hd{background:#252525;border-bottom:1px solid #3a3a3a}
body.dark:not(.force-mobile) .card,body.dark:not(.force-mobile) .rk,body.dark:not(.force-mobile) .slot,body.dark:not(.force-mobile) .stat,body.dark:not(.force-mobile) .plano,body.dark:not(.force-mobile) .score,body.dark:not(.force-mobile) .news,body.dark:not(.force-mobile) .hcard{border-color:#3a3a3a}
}
@media(max-width:899px){#btn-view{display:none}}
/* MODO NOTURNO (Windows dark) */
body.dark{background:#141414}
body.dark .phone{background:#202020}
body.dark .card,body.dark .hcard,body.dark .rk,body.dark .slot,body.dark .news,body.dark .score,body.dark .plano,body.dark .stat{background:#2b2b2b;box-shadow:none;border-color:#3a3a3a}
body.dark .plano{border-color:#3a3a3a}
body.dark .plano.hot{border-color:#ffb900}
body.dark h3,body.dark .card h3,body.dark .hcard h3,body.dark .rk .nm,body.dark .slot .h,body.dark .stat b,body.dark .news h3{color:#f0f0f0}
body.dark .stitle{color:#e8e8e8}
body.dark .search,body.dark .tabs .tab,body.dark .chip,body.dark .day{background:#2b2b2b;border-color:#3a3a3a;color:#cfd6dd}
body.dark .tab.on{background:#ffb900;border-color:#ffb900;color:#1b1b1b}
body.dark .chip.on{background:#0078d4;border-color:#0078d4;color:#fff}
body.dark .day.on{background:#0078d4;border-color:#0078d4;color:#fff}
body.dark .fld input,body.dark .fld select,body.dark .fld textarea{background:#2b2b2b;border-color:#3a3a3a;color:#eee}
body.dark .btn-ghost{background:#2b2b2b;color:#e8e8e8;border-color:#3a3a3a}
body.dark .dist{background:#252525}
body.dark .dist .dr,body.dark .card .meta,body.dark .hcard p,body.dark .news p,body.dark .plano p{color:#a8b2bc}
body.dark .al-b{background:#17293a;border-color:#2d4a63;color:#9cc3e5}
body.dark .al-y{background:#33290f;border-color:#5c4a1e;color:#e5c56b}
body.dark .al-g{background:#13291a;border-color:#245c33;color:#7fd39a}
body.dark .empty{color:#8a949e}
body.dark p{color:#a8b2bc}
}
#app{flex:1;overflow-y:auto;padding-bottom:78px}
/* HEADER */
.hd{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;padding:18px 18px 14px;position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px}
.hd .back{background:rgba(255,255,255,.14);border:none;color:#fff;border-radius:10px;width:34px;height:34px;font-size:1.05em;cursor:pointer;flex-shrink:0}
.hd h2{font-size:1.06em;font-weight:800;flex:1}
.hd .sub{font-size:.72em;opacity:.7;display:block;font-weight:400}
.hd .ic{font-size:1.3em}
/* SPLASH */
.splash{background:linear-gradient(160deg,#003e73 0%,#005a9e 55%,#0078d4 100%);min-height:92vh;display:flex;flex-direction:column;justify-content:center;align-items:center;color:#fff;text-align:center;padding:30px}
.splash h1{font-size:2.6em;font-weight:900;letter-spacing:-1px}
.splash h1 span{color:var(--org)}
.splash p{opacity:.75;margin:8px 0 38px;font-size:.95em}
.rolebtn{width:100%;max-width:300px;border:none;border-radius:16px;padding:18px;font-size:1.02em;font-weight:800;cursor:pointer;margin-bottom:14px;display:flex;align-items:center;gap:14px;text-align:left;transition:.15s}
.rolebtn:active{transform:scale(.97)}
.rolebtn .e{font-size:1.7em}
.rolebtn small{display:block;font-weight:500;font-size:.78em;opacity:.75;margin-top:2px}
.rb-p{background:var(--org);color:#1b1b1b}
.rb-a{background:rgba(255,255,255,.12);color:#fff;border:1.5px solid rgba(255,255,255,.3)}
.rb-w{background:rgba(116,185,255,.15);color:#cfe6ff;border:1.5px solid rgba(116,185,255,.4)}
.rb-g{background:rgba(46,204,113,.14);color:#d4f5e2;border:1.5px solid rgba(46,204,113,.45)}
.rb-t{background:rgba(245,166,35,.16);color:#ffe3b3;border:1.5px solid rgba(245,166,35,.45)}
.rb-c{background:rgba(214,120,255,.14);color:#efd9ff;border:1.5px solid rgba(214,120,255,.45)}
.menugrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.mi{background:#fff;border:1.5px solid #e3e7ee;border-radius:14px;padding:12px 10px;text-align:left;cursor:pointer;font-family:inherit;display:flex;gap:8px;align-items:center;font-size:.85em;font-weight:700;color:var(--navy)}
.mi span.e{font-size:1.4em}
.mi small{display:block;font-weight:400;color:#7a8699;font-size:.85em}
.dark .mi{background:#2b2b2b;border-color:#3a3a3a;color:#eee}
.plano{background:#fff;border:2px solid #dde5f0;border-radius:16px;padding:18px;margin-bottom:12px;cursor:pointer;position:relative;transition:.15s}
.plano:active{transform:scale(.98)}
.plano.hot{border-color:var(--org);box-shadow:0 4px 16px rgba(245,166,35,.25)}
.plano .tagp{position:absolute;top:-10px;right:14px;background:var(--org);color:#1b1b1b;border-radius:20px;font-size:.66em;font-weight:900;padding:3px 12px}
.plano h3{color:var(--navy);font-size:1em}
.plano .pr{font-size:1.25em;font-weight:900;color:var(--navy2);margin:4px 0}
.plano p{font-size:.8em;color:#789}
/* SECTIONS */
.pad{padding:16px}
.stitle{font-size:.82em;font-weight:800;color:var(--navy);text-transform:uppercase;letter-spacing:.5px;margin:18px 0 10px;display:flex;justify-content:space-between;align-items:center}
.stitle a{color:var(--org);font-size:.9em;text-decoration:none;cursor:pointer}
/* SEARCH */
.search{background:#fff;border:1.5px solid #dde5f0;border-radius:14px;padding:12px 16px;display:flex;gap:10px;color:#889;font-size:.92em;margin-bottom:4px}
/* CARDS */
.card{background:#fff;border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 2px 10px rgba(13,27,42,.06);cursor:pointer;transition:.15s}
.card:active{transform:scale(.98)}
.card h3{font-size:.98em;color:var(--navy);margin-bottom:4px}
.card .meta{font-size:.8em;color:#788;display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.hrow{display:flex;gap:12px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
.hrow::-webkit-scrollbar{display:none}
.hcard{min-width:170px;background:#fff;border-radius:16px;padding:14px;box-shadow:0 2px 10px rgba(13,27,42,.07);cursor:pointer;flex-shrink:0}
.hcard .top{font-size:1.6em;margin-bottom:6px}
.hcard h3{font-size:.9em;color:var(--navy)}
.hcard p{font-size:.76em;color:#788;margin-top:3px}
/* BADGES */
.badge{display:inline-block;border-radius:20px;padding:3px 11px;font-size:.72em;font-weight:700;margin:2px 2px 2px 0}
.bO{background:#fff3d0;color:#c97d0a}.bB{background:#e3edfb;color:#1b4a7a}.bG{background:#e5f9ee;color:#1e8f4e}.bR{background:#fdeaea;color:#c0392b}.bP{background:#f3e9fa;color:#7d3c98}.bN{background:var(--navy);color:#fff}.bGy{background:#636e72;color:#fff}
/* BUTTONS */
.btn{border:none;border-radius:12px;padding:13px 18px;font-size:.92em;font-weight:800;cursor:pointer;width:100%;margin-top:10px;transition:.15s}
.btn:active{transform:scale(.97)}
.btn-o{background:var(--org);color:#1b1b1b}
.btn-g{background:#25d366;color:#fff}
.btn-n{background:var(--navy2);color:#fff}
.btn-ghost{background:#fff;color:var(--navy);border:1.5px solid #dde5f0}
.btn-sm{width:auto;padding:8px 14px;font-size:.8em;margin-top:0}
.btn-grn{background:var(--grn);color:#fff}
.btn-red{background:var(--red);color:#fff}
/* WIDGET LIVE */
.live{background:linear-gradient(135deg,var(--navy),var(--navy3));border-radius:18px;padding:16px;color:#fff;margin-bottom:6px}
.live .lrow{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.1);font-size:.85em}
.live .lrow:last-child{border-bottom:none}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--red);margin-right:6px;animation:pl 1.2s infinite}
@keyframes pl{50%{opacity:.3}}
/* AGENDA */
.days{display:flex;gap:8px;overflow-x:auto;margin-bottom:12px;scrollbar-width:none}
.day{background:#fff;border:1.5px solid #dde5f0;border-radius:12px;padding:8px 14px;text-align:center;cursor:pointer;flex-shrink:0;font-size:.8em;color:#567}
.day.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.day b{display:block;font-size:1.15em}
.slot{background:#fff;border-radius:12px;padding:12px 14px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 1px 6px rgba(13,27,42,.05)}
.slot .h{font-weight:800;color:var(--navy);font-size:.92em;width:48px}
.st{font-size:.78em;font-weight:700;border-radius:20px;padding:4px 12px}
.st-l{background:#e5f9ee;color:#1e8f4e}.st-o{background:#fdeaea;color:#c0392b}.st-p{background:#fff3d0;color:#c97d0a}
/* TABS */
.tabs{display:flex;gap:6px;margin:12px 0;overflow-x:auto;scrollbar-width:none}
.tab{background:#fff;border:1.5px solid #dde5f0;border-radius:20px;padding:7px 16px;font-size:.8em;font-weight:700;color:#567;cursor:pointer;white-space:nowrap;flex-shrink:0}
.tab.on{background:var(--org);border-color:var(--org);color:#1b1b1b}
/* STATS */
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:14px}
.stat{background:#fff;border-radius:14px;padding:14px 10px;text-align:center;box-shadow:0 2px 8px rgba(13,27,42,.06)}
.stat b{font-size:1.35em;color:var(--navy);display:block}
.stat span{font-size:.68em;color:#789;text-transform:uppercase;font-weight:700;letter-spacing:.4px}
.stat.g b{color:#1e8f4e}.stat.r b{color:#c0392b}.stat.o b{color:#c97d0a}
/* RANK */
.rk{background:#fff;border-radius:14px;padding:12px 14px;margin-bottom:8px;display:flex;align-items:center;gap:12px;box-shadow:0 1px 6px rgba(13,27,42,.05)}
.rk .pos{font-weight:900;color:var(--org);width:36px;font-size:1.05em}
.rk .nm{flex:1;font-weight:700;color:var(--navy);font-size:.92em}
.rk .nm small{display:block;font-weight:500;color:#889;font-size:.8em}
.rk .pts{font-weight:800;color:#1e8f4e;font-size:.88em}
/* NAV */
.nav{position:absolute;bottom:0;left:0;right:0;background:var(--navy);display:flex;justify-content:space-around;padding:10px 4px 14px;z-index:50}
.ni{background:none;border:none;color:#8a9bb0;font-size:.66em;font-weight:700;text-align:center;cursor:pointer;padding:2px 8px}
.ni span{display:block;font-size:1.55em;margin-bottom:2px}
.ni.on{color:var(--org)}
/* FORM */
.fld{margin-bottom:12px}
.fld label{display:block;font-size:.78em;font-weight:700;color:var(--navy);margin-bottom:6px}
.fld input,.fld select,.fld textarea{width:100%;border:1.5px solid #dde5f0;border-radius:12px;padding:11px 14px;font-size:.9em;background:#fff;color:#234;font-family:inherit}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:#fff;border:1.5px solid #dde5f0;border-radius:20px;padding:7px 14px;font-size:.78em;font-weight:700;color:#567;cursor:pointer}
.chip.on{background:var(--navy2);border-color:var(--navy2);color:#fff}
/* SCORE */
.score{background:#fff;border-radius:16px;padding:18px;box-shadow:0 2px 10px rgba(13,27,42,.06)}
.svs{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:14px 0}
.steam{flex:1;text-align:center;font-size:.82em;font-weight:700;color:var(--navy)}
.snum{display:flex;align-items:center;gap:8px}
.snum button{width:30px;height:30px;border:none;border-radius:8px;background:#e8eef8;font-weight:900;cursor:pointer;color:var(--navy)}
.snum b{font-size:1.7em;width:36px;text-align:center;color:var(--navy)}
.dist{background:#f7f9fd;border-radius:12px;padding:12px;margin-top:12px;font-size:.82em}
.dist .dr{display:flex;justify-content:space-between;padding:4px 0}
/* ALERT / TOAST */
.al{border-radius:12px;padding:13px 15px;margin-bottom:12px;font-size:.85em}
.al-y{background:#fff9e8;border:1.5px solid #f5d78e;color:#8a6d1a}
.al-g{background:#eafaf1;border:1.5px solid #a8e6c5;color:#1e6b42}
.al-b{background:#e8f4fd;border:1.5px solid #a8d4f0;color:#1b4a7a}
#toast{position:absolute;bottom:90px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--navy);color:#fff;padding:12px 22px;border-radius:30px;font-size:.85em;font-weight:700;opacity:0;transition:.3s;z-index:99;white-space:nowrap;pointer-events:none;box-shadow:0 6px 20px rgba(0,0,0,.3)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
/* NEWS */
.news{background:#fff;border-radius:16px;overflow:hidden;margin-bottom:12px;box-shadow:0 2px 10px rgba(13,27,42,.06);cursor:pointer}
.news .nimg{height:86px;display:flex;align-items:center;justify-content:center;font-size:2.4em;color:#fff}
.news .nbody{padding:12px 14px}
.news h3{font-size:.9em;color:var(--navy)}
.news p{font-size:.76em;color:#789;margin-top:4px}
.news .tag{font-size:.68em;font-weight:800;color:var(--org);text-transform:uppercase;letter-spacing:.5px}
/* H2H */
.h2h{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;margin:14px 0}
.h2h .pl{background:#fff;border-radius:14px;padding:14px 8px;text-align:center;box-shadow:0 2px 8px rgba(13,27,42,.06)}
.h2h .pl .av{font-size:2em}
.h2h .pl b{display:block;font-size:.82em;color:var(--navy);margin-top:4px}
.h2h .vs{font-weight:900;color:var(--org);font-size:1.1em}
.hbar{display:flex;height:10px;border-radius:6px;overflow:hidden;margin:6px 0 14px}
.hbar div:first-child{background:var(--grn)}.hbar div:last-child{background:var(--red)}
.empty{text-align:center;color:#99a;padding:40px 20px;font-size:.9em}
.empty span{font-size:2.6em;display:block;margin-bottom:10px}
</style>
</head>
<body>
<div id="modes" style="position:fixed;top:12px;right:14px;z-index:999;display:flex;gap:8px">
  <button id="btn-dark" onclick="toggleDark()" title="Modo noturno" style="width:42px;height:42px;border-radius:50%;border:1.5px solid rgba(255,255,255,.35);background:rgba(0,0,0,.45);color:#fff;font-size:1.15em;cursor:pointer">🌙</button>
  <button id="btn-view" onclick="toggleView()" title="Alternar computador/celular" style="width:42px;height:42px;border-radius:50%;border:1.5px solid rgba(255,255,255,.35);background:rgba(0,0,0,.45);color:#fff;font-size:1.15em;cursor:pointer">📱</button>
</div>
<div class="phone">
  <div id="app"></div>
  <div id="navbar"></div>
  <div id="toast"></div>
</div>

<script>
/* ═══════════ DADOS (simulação em memória) ═══════════ */
const DB = {

/* ═══════════ ESTADO / NAVEGAÇÃO ═══════════ */
let S = {role:null, screen:'intro', stack:[], param:null, tab:null, day:0};

function go(screen, param=null, tab=null){ S.stack.push({screen:S.screen,param:S.param,tab:S.tab}); S.screen=screen; S.param=param; S.tab=tab; render(); }
function back(){ const p=S.stack.pop(); if(p){S.screen=p.screen;S.param=p.param;S.tab=p.tab; render(); return;} const home={player:'p-home',arena:'a-dash',prof:'pr-home',grupo:'g-home'}[S.role]; nav(home||'splash'); }
function nav(screen){ S.stack=[]; S.screen=screen; S.param=null; S.tab=null; render(); }
function setTab(t){ S.tab=t; render(); }
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2400); }

/* ═══════════ COMPONENTES ═══════════ */
function header(title, sub='', showBack=true){
  return `<div class="hd"><button class="back" onclick="back()">‹</button><h2>${title}${sub?`<span class="sub">${sub}</span>`:''}</h2></div>`;
}
function navbar(){
  const el=document.getElementById('navbar');
  if(S.role==='player'){

    const items=[['pr-home','🏠','Início'],['pr-agenda','⏰','Agenda'],['pr-turmas','👥','Turmas'],['pr-alunos','📋','Alunos'],['pr-perfil','🎓','Perfil']];

  } else if(S.role==='grupo'){

function salvarJogo(){
  const g=id=>document.getElementById(id);
  const sa=parseInt(g('mj-sa').value)||0, sb=parseInt(g('mj-sb').value)||0;
  if(sa===sb){ toast('⚠️ O placar não pode terminar empatado'); return; }
  const adv1=g('mj-adv1').value.trim(), adv2=g('mj-adv2').value.trim();
  if(!adv1){ toast('⚠️ Informe pelo menos um adversário'); return; }
  const local=g('mj-local2').value.trim() || g('mj-local').value;
  const dISO=g('mj-data').value||'2026-08-11';
  const d=dISO.split('-').reverse().map((x,i)=>i===2?x.slice(2):x).join('/');
  const hora=(g('mj-hora').value||'19:00').replace(':','h');
  const par=g('mj-par').value.trim()||'— (simples)';
  DB.historico.unshift({d, hora, arena:local, ev:'Jogo avulso', tipo:'avulso', par, adv:adv2?adv1+' & '+adv2:adv1, pl:`${sa} × ${sb}`, res:sa>sb?'win':'loss', manual:true});
  DB.me.won+=sa; DB.me.lost+=sb;
  toast('Jogo registrado no histórico! 📝'); S.tab=null; nav('p-perfil'); go('p-historico');
}

function carregarITF(){

  ]).then(([rk,ev])=>{

      DB.calend=ev.map(x=>({n:x.nome,det:x.detalhe,tipo:x.tipo,live:!!x.live,yt:x.yt||null}));

    itfCarregado=true;
    if(S.screen==='portal'||S.screen==='portal-h2h') render();

}

function rankGrupo(){
  const r={};
  DB.grupo.membros.forEach(m=>r[m]={n:m,won:0,lost:0,j:0});
  DB.grupo.jogos.forEach(j=>{
    j.a.forEach(m=>{ if(r[m]){r[m].won+=j.sa; r[m].lost+=j.sb; r[m].j++;} });
    j.b.forEach(m=>{ if(r[m]){r[m].won+=j.sb; r[m].lost+=j.sa; r[m].j++;} });
  });
  return Object.values(r).sort((a,b)=>(b.won-b.lost)-(a.won-a.lost));
}

function simTempo(){
  const a=DB.assinatura; if(!a) return;

  else if(a.status==='d3'){ a.status='vencida'; a.log.unshift('02/08 💳 Cobrança automática falhou (cartão recusado)','05/08 ⚠️ E-mail + WhatsApp: pagamento em atraso'); toast('⏩ Venceu — avisos de atraso enviados'); }
  else if(a.status==='vencida'){ a.status='rebaixada'; a.log.unshift('09/08 ⚪ Conta rebaixada para o plano grátis — dados preservados'); toast('⏩ 7 dias de atraso — conta rebaixada'); }

function profChamada(id, st){
  const a=DB.prof.alunos.find(x=>x.id===id); if(!a) return;
  const antes=DB.prof.chamada[id];

  if(st==='avisada' && antes!=='avisada'){ a.repo++; toast(a.nome.split(' ')[0]+' ganhou 1 reposição 🔁'); }
  else if(st==='falta' && antes!=='falta'){ a.faltas++; toast('Falta registrada — aluno notificado 🔔'); }
  else if(st==='pres' && antes!=='pres'){ a.pres++; }
  render();
}

function alunoCicloSt(id,i){

  a.hist[i].st=ordem[(ordem.indexOf(a.hist[i].st)+1)%3];
  toast('Registro do dia corrigido ✏️'); render();

function alunoSalvaObs(id,i){
  const a=DB.prof.alunos.find(x=>x.id===id); if(!a||!a.hist[i]) return;

  toast('Anotação salva 💾'); render();

function vAQuadras(){
  return header('🎾 Quadras — Agenda','Quadra 1 · Ter 18/08', false)+`
  <div class="pad">
    ${DB.pedidos.length?`<div class="stitle">📬 Pedidos de reserva (${DB.pedidos.length})</div>`+DB.pedidos.map(p=>`
      <div class="card" style="cursor:default">
        <h3>⏳ ${p.nome}</h3><div class="meta"><span>${p.det}</span></div>${p.pg?`<div style="margin-top:6px"><span class="badge bG">${p.pg}</span><span class="badge bB">R$ 80,00</span></div>`:''}
        <div style="display:flex;gap:8px;margin-top:10px">
          <button class="btn btn-grn btn-sm" style="flex:1" onclick="responder(${p.id},true)">✅ Confirmar</button>
          <button class="btn btn-red btn-sm" style="flex:1" onclick="responder(${p.id},false)">❌ Recusar</button>
          <button class="btn btn-ghost btn-sm" onclick="toast('Abrindo WhatsApp 💬')">💬</button>
        </div>
      </div>`).join(''):''}
    <div class="stitle">📅 Agenda do dia</div>
    ${DB.slots.map((s,i)=>{
      if(s.status==='livre') return `<div class="slot"><span class="h">${s.h}</span><span class="st st-l">🟢 Livre</span><button class="btn btn-ghost btn-sm" onclick="DB.slots[${i}].status='ocupado';DB.slots[${i}].who='Bloqueio manual';toast('Horário bloqueado 🔒');render()">Bloquear</button></div>`;
      if(s.status==='ocupado') return `<div class="slot"><span class="h">${s.h}</span><span class="st st-o">🔴 ${s.who}</span><button class="btn btn-ghost btn-sm" onclick="DB.slots[${i}].status='livre';DB.slots[${i}].who=null;toast('Horário liberado ✅');render()">Liberar</button></div>`;
      return `<div class="slot"><span class="h">${s.h}</span><span class="st st-p">🟡 ${s.who}</span><span style="font-size:.75em;color:#c97d0a;font-weight:700">responder acima ↑</span></div>`;
    }).join('')}
  </div>`;
}
function responder(id, ok){
  const p=DB.pedidos.find(x=>x.id===id); if(!p) return;
  const slot=DB.slots.find(s=>s.h===p.slotH);
  if(slot){ slot.status= ok?'ocupado':'livre'; slot.who= ok?p.nome:null; }
  const res=DB.minhasReservas.find(r=>r.det.includes(p.slotH)); if(res) res.status= ok?'confirmada':'recusada';
  DB.pedidos=DB.pedidos.filter(x=>x.id!==id);
  toast(ok?'Reserva confirmada! Jogador notificado 🔔':'Pedido recusado. Jogador notificado 🔔');
  render();
}

  return header('📋 Lançar Games','Liga Ter Mista · Rodada 8 · Partida 1 de 4', false)+`

      <div style="text-align:center;font-size:.78em;font-weight:800;color:#889;text-transform:uppercase;letter-spacing:.5px">Placar da partida (games)</div>
      <div class="svs">
        <div class="steam">🔵 ${p.ta}</div>
        <div class="snum"><button onclick="DB.partidaAtual.sa=Math.max(0,DB.partidaAtual.sa-1);render()">−</button><b>${p.sa}</b><button onclick="DB.partidaAtual.sa++;render()">+</button></div>
      </div>
      <div style="text-align:center;font-weight:900;color:var(--org)">×</div>
      <div class="svs">
        <div class="steam">🔴 ${p.tb}</div>
        <div class="snum"><button onclick="DB.partidaAtual.sb=Math.max(0,DB.partidaAtual.sb-1);render()">−</button><b>${p.sb}</b><button onclick="DB.partidaAtual.sb++;render()">+</button></div>

function lancar(){
  const p=DB.partidaAtual; p.lancada=true;

  if(p.ta.includes('João')){

  }
  toast('Placar confirmado! Games distribuídos 📊'); render();
}

/* Preferências de exibição */
function toggleDark(){
  document.body.classList.toggle('dark');
  const on=document.body.classList.contains('dark');
  document.getElementById('btn-dark').textContent=on?'☀️':'🌙';
  try{localStorage.setItem('bz-dark',on?'1':'0');}catch(e){}
}
function toggleView(){
  document.body.classList.toggle('force-mobile');
  const on=document.body.classList.contains('force-mobile');
  document.getElementById('btn-view').textContent=on?'🖥️':'📱';
  try{localStorage.setItem('bz-view',on?'1':'0');}catch(e){}
}
try{
  if(localStorage.getItem('bz-demo')==='1'){ S.demo=true; DB.classif.cadastroCompleto=true; }
  if(localStorage.getItem('bz-dark')==='1') toggleDark();
  if(localStorage.getItem('bz-view')==='1') toggleView();
}catch(e){}
